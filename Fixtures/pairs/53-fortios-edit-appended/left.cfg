config system global
    set hostname "iface_warn"
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.122.2 255.255.255.0
        set type physical
    next
    edit "missing_vlanid"
        set vdom root
        set interface port1
    next
    edit "missing_iface"
        set vdom root
        set vlanid 999
    next
end
config system zone
    edit conflict
        set interface port1
    next
end
